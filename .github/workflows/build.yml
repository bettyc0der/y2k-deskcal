name: Build desktop app
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: y2k-deskcal-${{ matrix.os }}
          path: release/**
